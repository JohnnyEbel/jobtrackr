name: Docker Build

on:
  push:
    branches: [ "main", "feature/**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t jobtrackr:ci ./app